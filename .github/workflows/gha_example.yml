name: CI/CD Pipeline - WeatherApp Production

on:
  push:
    branches: [zadanie-2]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-secure:
    name: Build, Scan CVE and Push Multi-Arch Image
    runs-on: ubuntu-latest

    steps:
      - name: Check out the source repo
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata definitions
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/weather-app
          flavor: |
            latest=false
          tags: |
            type=sha,priority=100,prefix=sha-,format=short
            type=ref,event=branch
          convert-lowercase: true

      - name: Build local image for CVE scanning
        uses: docker/build-push-action@v6
        with:
          context: ./ZADANIE1
          file: ./ZADANIE1/Dockerfile
          push: false
          load: true
          tags: weather-app:test

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'weather-app:test'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Build and push Multi-Arch Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./ZADANIE1
          file: ./ZADANIE1/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=registry,ref=docker.io/${{ vars.DOCKERHUB_USERNAME }}/weather-app-cache:latest
          cache-to: type=registry,ref=docker.io/${{ vars.DOCKERHUB_USERNAME }}/weather-app-cache:latest,mode=max
          tags: ${{ steps.meta.outputs.tags }}
